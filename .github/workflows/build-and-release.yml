name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 2.3.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - draft
          - release
        default: draft

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > lsposed_module/magicwindow.keystore

      - name: Grant execute permission
        run: |
          chmod +x lsposed_module/gradlew
          ls -la lsposed_module/

      - name: Build Debug APK
        working-directory: lsposed_module
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: lsposed_module
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=$(grep -o 'versionCode = [0-9]*' lsposed_module/app/build.gradle.kts | grep -o '[0-9]*')" >> $GITHUB_OUTPUT

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicWindow-Debug
          path: lsposed_module/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicWindow-Release
          path: lsposed_module/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version_name }}
          body: |
            ## 更新日志
            
            ### 新增功能
            - TODO: 描述本次更新的内容
            
            ### 技术细节
            - Version Code: ${{ steps.version.outputs.version_code }}
            
            ## 下载
            - [Debug 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Release 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            lsposed_module/app/build/outputs/apk/release/app-release.apk
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Create Draft Release (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'draft'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Draft v${{ steps.version.outputs.version_name }}
          body: |
            ## 更新日志
            
            ### 新增功能
            - TODO: 描述本次更新的内容
            
            ### 技术细节
            - Version Code: ${{ steps.version.outputs.version_code }}
            
            ## 下载
            - [Debug 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Release 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            lsposed_module/app/build/outputs/apk/release/app-release.apk
          draft: true
          prerelease: false

      - name: Create Release (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Release v${{ steps.version.outputs.version_name }}
          body: |
            ## 更新日志
            
            ### 新增功能
            - TODO: 描述本次更新的内容
            
            ### 技术细节
            - Version Code: ${{ steps.version.outputs.version_code }}
            
            ## 下载
            - [Debug 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Release 版本](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            lsposed_module/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false

  notify:
    name: Notify Build Status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Status
        run: |
          echo "Build completed with status: ${{ needs.build.result }}"
